server {
    listen 80;
    root /usr/share/nginx/html;
    index index.php;

    # Las páginas .php del frontend son HTML estático
    types { text/html php; text/css css; application/javascript js; image/jpeg jpg jpeg; image/png png; image/svg+xml svg; image/webp webp; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https:; font-src 'self' https: data:; connect-src 'self' http://localhost:8000; frame-src https://www.google.com https://maps.google.com" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
