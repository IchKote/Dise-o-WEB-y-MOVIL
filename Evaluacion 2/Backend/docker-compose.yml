services:
  vault:
    image: hashicorp/vault:1.17
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root-token-masala
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    networks: [privada]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 3s
      retries: 20

  vault-init:
    build: { context: ., args: { SERVICE: gateway } }
    command: python scripts/vault_init.py
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_ROOT_TOKEN: root-token-masala
    depends_on:
      vault: { condition: service_healthy }
    networks: [privada]
    restart: "no"

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: masala
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-masala-dev-password}
    volumes: [mongo-data:/data/db]
    networks: [privada]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')", "-u", "masala", "-p", "${MONGO_PASSWORD:-masala-dev-password}", "--authenticationDatabase", "admin"]
      interval: 5s
      retries: 20

  auth: &servicio
    build: { context: ., args: { SERVICE: auth } }
    environment: &env
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: vt-auth
      MONGO_URL: mongodb://masala:${MONGO_PASSWORD:-masala-dev-password}@mongo:27017/?authSource=admin
    depends_on:
      vault-init: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }
    networks: [privada]
    restart: unless-stopped

  clients:
    <<: *servicio
    build: { context: ., args: { SERVICE: clients } }
    environment: { <<: *env, VAULT_TOKEN: vt-clients }

  inventory:
    <<: *servicio
    build: { context: ., args: { SERVICE: inventory } }
    environment: { <<: *env, VAULT_TOKEN: vt-inventory }

  orders:
    <<: *servicio
    build: { context: ., args: { SERVICE: orders } }
    environment: { <<: *env, VAULT_TOKEN: vt-orders }

  payments:
    <<: *servicio
    build: { context: ., args: { SERVICE: payments } }
    environment: { <<: *env, VAULT_TOKEN: vt-payments }

  gateway:
    <<: *servicio
    build: { context: ., args: { SERVICE: gateway } }
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: vt-gateway
      CORS_ORIGINS: http://localhost:8080
      GRAPHQL_URL: http://graphql:8100
    ports: ["8000:8000"]
    depends_on:
      vault-init: { condition: service_completed_successfully }
      auth: { condition: service_started }
      clients: { condition: service_started }
      inventory: { condition: service_started }
      orders: { condition: service_started }
      payments: { condition: service_started }
      graphql: { condition: service_started }
    networks: [publica, privada]

  graphql:
    build: ./graphql
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: vt-graphql
      CLIENTS_URL: http://clients:8000
      INVENTORY_URL: http://inventory:8000
      ORDERS_URL: http://orders:8000
      PAYMENTS_URL: http://payments:8000
    depends_on:
      vault-init: { condition: service_completed_successfully }
      orders: { condition: service_started }
    networks: [privada]
    restart: unless-stopped

  # Demostración opcional (no forma parte del backend): docker compose --profile demo up --build
  frontend:
    profiles: [demo]
    image: nginx:1.27-alpine
    volumes:
      - ../Frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]
    networks: [publica]

# publica: lo que ve el navegador. privada: servicios, base de datos y Vault (sin puertos publicados)
networks:
  publica:
  privada:
    internal: true

volumes:
  mongo-data:
